<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ilvarin Admin — Products &amp; Prices</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f2ee; color: #1c1a18; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: .06em; }
  .sub { color: #6b6259; margin: 0 0 24px; font-size: 15px; }
  .card { background: #fff; border: 1px solid #e5ddd3; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: #6b6259; margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  input { width: 100%; font-size: 17px; padding: 12px; border: 1px solid #d8cfc4; border-radius: 10px; }
  input:focus { outline: 2px solid #1c1a18; outline-offset: 1px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .pname { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
  .pid { font-size: 12px; color: #9a8f83; }
  button { width: 100%; font-size: 18px; font-weight: 700; padding: 15px; border: 0; border-radius: 12px; background: #1c1a18; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .msg { margin: 12px 0 0; font-size: 15px; min-height: 22px; }
  .msg.ok { color: #1d7a3d; }
  .msg.err { color: #b3261e; }
  .hint { font-size: 13px; color: #6b6259; margin-top: 20px; line-height: 1.5; }
  .hint a { color: #1c1a18; }
  .hidden { display: none; }
  .logout { background: none; border: 0; color: #6b6259; font-size: 14px; width: auto; padding: 8px 0; font-weight: 400; text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ILVARIN ADMIN</h1>
  <p class="sub">Change product names and prices. That is all this page does.</p>

  <div id="loginBox" class="card">
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Enter your admin password">
    <div style="height:12px"></div>
    <button id="loginBtn" type="button">Log in</button>
    <p id="loginMsg" class="msg"></p>
  </div>

  <div id="editorBox" class="hidden">
    <div id="productList"></div>
    <button id="saveBtn" type="button">Save changes</button>
    <p id="saveMsg" class="msg"></p>
    <p class="hint">After saving, the live shop shows the new names and prices when the page is reloaded. Leave a price empty when a product has no price yet — it will show as WhatsApp-only, with no add-to-cart button.</p>
    <p class="hint"><a href="https://ilvarin-3d-best-sellers.vercel.app/" target="_blank" rel="noopener">Open the live shop &nearr;</a></p>
    <button id="logoutBtn" class="logout" type="button">Log out</button>
  </div>
</div>
<script>
(function () {
  var pwInput = document.getElementById('pw');
  var loginBtn = document.getElementById('loginBtn');
  var loginMsg = document.getElementById('loginMsg');
  var loginBox = document.getElementById('loginBox');
  var editorBox = document.getElementById('editorBox');
  var productList = document.getElementById('productList');
  var saveBtn = document.getElementById('saveBtn');
  var saveMsg = document.getElementById('saveMsg');
  var logoutBtn = document.getElementById('logoutBtn');
  var password = sessionStorage.getItem('ilvarin-admin-pw') || '';
  var products = [];

  function showMsg(el, text, ok) {
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  function render() {
    productList.innerHTML = '';
    products.forEach(function (p, i) {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="pname">' + escapeHtml(p.name) + '</div>' +
        '<div class="pid">' + escapeHtml(p.id) + '</div>' +
        '<label>Name</label>' +
        '<input data-i="' + i + '" data-f="name" type="text" value="' + escapeAttr(p.name) + '">' +
        '<div class="row"><div>' +
        '<label>Price (&#2547;) — empty = no price</label>' +
        '<input data-i="' + i + '" data-f="price" type="number" min="0" step="1" inputmode="numeric" value="' + (p.price === null || p.price === undefined ? '' : p.price) + '">' +
        '</div><div>' +
        '<label>Old price (&#2547;) — optional</label>' +
        '<input data-i="' + i + '" data-f="was" type="number" min="0" step="1" inputmode="numeric" value="' + (p.was === null || p.was === undefined ? '' : p.was) + '">' +
        '</div></div>';
      productList.appendChild(card);
    });
    productList.querySelectorAll('input').forEach(function (input) {
      input.addEventListener('input', function () {
        var i = Number(input.getAttribute('data-i'));
        var f = input.getAttribute('data-f');
        products[i][f] = input.value;
        if (f === 'name') {
          card.querySelector('.pname').textContent = input.value || '(no name)';
        }
      });
      function card() { return input.closest('.card'); }
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

  function postAdmin(payload) {
    return fetch('/api/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
  }

  function loadProducts() {
    return fetch('/api/products', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        products = (j.products || []).map(function (p) {
          return { id: p.id, name: p.name, price: p.price === null ? null : p.price, was: p.was === null ? null : p.was };
        });
        loginBox.classList.add('hidden');
        editorBox.classList.remove('hidden');
        render();
      });
  }

  function tryLogin(pw) {
    loginBtn.disabled = true;
    showMsg(loginMsg, '', true);
    postAdmin({ password: pw, action: 'check' }).then(function (res) {
      loginBtn.disabled = false;
      if (res.status === 200 && res.body && res.body.ok) {
        password = pw;
        sessionStorage.setItem('ilvarin-admin-pw', pw);
        return loadProducts();
      }
      showMsg(loginMsg, res.status === 401 ? 'Wrong password. Try again.' : 'Could not log in. Check your connection and try again.', false);
    }).catch(function () {
      loginBtn.disabled = false;
      showMsg(loginMsg, 'Could not reach the server. Try again.', false);
    });
  }

  loginBtn.addEventListener('click', function () {
    var pw = pwInput.value;
    if (!pw) { showMsg(loginMsg, 'Enter your password first.', false); return; }
    tryLogin(pw);
  });
  pwInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') loginBtn.click();
  });

  saveBtn.addEventListener('click', function () {
    saveBtn.disabled = true;
    showMsg(saveMsg, 'Saving…', true);
    var cleaned = products.map(function (p) {
      return {
        id: p.id,
        name: String(p.name || '').trim(),
        price: p.price === '' || p.price === null || p.price === undefined ? null : Number(p.price),
        was: p.was === '' || p.was === null || p.was === undefined ? null : Number(p.was)
      };
    });
    postAdmin({ password: password, products: cleaned }).then(function (res) {
      saveBtn.disabled = false;
      if (res.status === 200 && res.body && res.body.ok) {
        showMsg(saveMsg, 'Saved. The live shop shows the new names and prices after a reload.', true);
      } else if (res.status === 401) {
        showMsg(saveMsg, 'Wrong password. Log out and log in again.', false);
      } else {
        showMsg(saveMsg, 'Could not save. ' + ((res.body && res.body.error) || 'Try again.'), false);
      }
    }).catch(function () {
      saveBtn.disabled = false;
      showMsg(saveMsg, 'Could not reach the server. Try again.', false);
    });
  });

  logoutBtn.addEventListener('click', function () {
    sessionStorage.removeItem('ilvarin-admin-pw');
    password = '';
    location.reload();
  });

  if (password) { tryLogin(password); }
})();
</script>
</body>
</html>
